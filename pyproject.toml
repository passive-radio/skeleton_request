[project]
name = "skeleton-request"
version = "0.1.0"
description = "HTTP API tracing, emulation library for offline development and documentation of legacy API specifications."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0",
    "openai>=2.8.0,<2.9.0",
]
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
keywords = ["api", "testing", "emulation", "tracing", "llm", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/passive-radio/skeleton_request"
Repository = "https://github.com/passive-radio/skeleton_request"
Documentation = "https://github.com/passive-radio/skeleton_request#readme"
"Bug Tracker" = "https://github.com/passive-radio/skeleton_request/issues"

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.2.2",
]

[project.scripts]
skeleton = "skeleton_request.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skeleton_request"]

[dependency-groups]
dev = [
    "openai>=2.8.0",
]
